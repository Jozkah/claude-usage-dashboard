<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ghost: minimalist direction</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f3;--card:#fff;--fg:#141414;--mute:#8a8a87;--line:#e8e8e6;--accent:#1a5cff}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--fg);font:14px/1.45 "Inter Tight",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 90px}
.ghost{font-weight:800;font-size:clamp(90px,19vw,250px);line-height:.8;letter-spacing:-.06em;color:#e9e9e7;text-align:center;padding-top:34px;height:190px;overflow:hidden;user-select:none}
nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:58px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
nav .l,nav .r{display:flex;gap:18px}.nav .r{justify-content:flex-end}nav .r{justify-content:flex-end}
nav sup{color:var(--mute);font-size:10px;margin-left:2px}
nav .mark{width:32px;height:32px;border-radius:8px;background:var(--fg);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.lead{text-align:center;padding:54px 0 34px}.lead p{font-size:22px;letter-spacing:-.02em;font-weight:500}.lead span{color:var(--mute)}
.chips{display:flex;gap:10px;overflow:auto;margin-bottom:22px}
.chip{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 16px;min-width:140px}
.chip small{color:var(--mute);display:block}.chip b{font-size:20px;font-weight:600;letter-spacing:-.02em}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:6px}
.cell>header{display:flex;justify-content:space-between;padding:12px 16px 8px;color:var(--mute)}
.cell>header b{color:var(--fg);font-weight:600}
.inner{background:var(--bg);border-radius:16px;padding:6px 16px}
.acct{padding:14px 0}.acct+.acct{border-top:1px solid var(--line)}
.acct h3{font-size:14px;font-weight:600;display:flex;justify-content:space-between}.acct h3 small{color:var(--mute);font-weight:400}
.lim{display:grid;grid-template-columns:54px 1fr 40px;gap:10px;align-items:center;margin-top:8px}.lim span{color:var(--mute)}.lim b{text-align:right;font-weight:600}.lim b.bad{color:#d4260d}
.bar{position:relative;height:6px;border-radius:3px;background:#e1e1de;display:flex}
.bar i{display:block;height:100%;background:#9a9a96;border-right:2px solid var(--bg)}.bar i:first-child{border-radius:3px 0 0 3px}
.bar i.today{background:var(--accent);border-right:0;border-radius:0 3px 3px 0}
.bar b{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--fg)}
.bar.none{background:none;color:var(--mute);height:auto}
@media(max-width:820px){.grid{grid-template-columns:1fr}nav .l{display:none}nav{grid-template-columns:auto 1fr}}
</style></head><body>
<div class="wrap">
<div class="ghost" aria-hidden="true">USAGE</div>
<nav><div class="l"><span>Limits<sup>6</sup></span><span>Accounts<sup>5</sup></span><span>Resets</span></div><div class="mark">U</div><div class="r"><span>Daily usage</span><span>Refresh</span></div></nav>
<div class="lead"><p id="head"></p></div>
<div class="chips" id="chips"></div>
<div class="grid" id="grid"></div>
</div>
<script src="../shared/data.js"></script><script src="common.js"></script><script src="parts.js"></script>
<script>
const D = window.DASH, best = D.best();
document.getElementById('head').innerHTML = `Most room: <span style="color:var(--accent)">${best.name}</span> <span>· ${D.left(best)}% left</span>`;
document.getElementById('chips').innerHTML = D.nextResets.slice(0, 5).map((r) => `<div class="chip"><small>${r.a.name} · ${r.label}</small><b>${D.clock(r.mins)}</b> <small style="display:inline">in ${r.reset}</small></div>`).join('');
const lim = (a, k) => { const l = D.limit(a, k); return `<div class="lim"><span>${k === 'five' ? 'Session' : 'Weekly'}</span>${l.bar}${l.left == null ? '<b></b>' : `<b class="${l.left < 20 ? 'bad' : ''}">${l.left}%</b>`}</div>`; };
document.getElementById('grid').append(...D.byProvider.map((g, i) => D.html(`<div class="cell" style="${i ? '' : 'grid-row:span 1'}"><header><b>${g.name}</b><span>${String(g.accounts.length).padStart(2, '0')}</span></header><div class="inner">${g.accounts.map((a) => `<div class="acct"><h3>${a.name}<small>${a.plan}</small></h3>${lim(a, 'five')}${lim(a, 'week')}</div>`).join('')}</div></div>`)));
</script></body></html>
