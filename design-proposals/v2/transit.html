<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit: usage dashboard direction</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ground:#0b1530;--deep:#08112a;--porcelain:#f3f1ea;--mute:#9aa6c4;--rule:#22305a;--claude:#e5382f;--codex:#2f6bff;--amber:#f5a623;--green:#22b573}
*{box-sizing:border-box;margin:0}
html{background:var(--ground);color:var(--porcelain);font-family:"Atkinson Hyperlegible",sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{padding:28px 24px 80px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:26px}
.num{font-variant-numeric:tabular-nums}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;border-bottom:2px solid var(--porcelain);padding-bottom:12px}
header h1{font-size:22px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--porcelain);color:var(--ground);padding:5px 12px;border-radius:999px;font-weight:700}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--green)}
.line{background:var(--deep);border:1px solid var(--rule);border-radius:6px;padding:20px 22px}
.line h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;margin-bottom:6px}
.line h2 b{display:inline-block;width:34px;height:10px;border-radius:5px;background:var(--c)}
.line p.sub{color:var(--mute);margin-bottom:14px}
.station{display:grid;grid-template-columns:28px 160px 1fr;gap:12px;align-items:stretch}
.rail{position:relative;display:flex;justify-content:center}
.rail:before{content:"";position:absolute;top:0;bottom:0;width:8px;background:var(--c)}
.station:first-of-type .rail:before{top:50%}.station:last-of-type .rail:before{bottom:50%}
.dot{position:relative;align-self:center;width:22px;height:22px;border-radius:50%;background:var(--porcelain);border:6px solid var(--c)}
.name{align-self:center;padding:14px 0}
.name b{display:block;font-size:16px}
.name span{color:var(--mute);font-size:13px}
.lims{display:grid;gap:12px;padding:14px 0;align-content:center}
.lim{display:grid;grid-template-columns:70px 1fr 64px 120px;gap:12px;align-items:center}
.lim .l{color:var(--mute)}
.track{position:relative;height:16px;background:#14214a;border-radius:3px;display:flex;overflow:visible}
.track i{display:block;height:100%;background:var(--c);opacity:.55;border-right:2px solid var(--deep)}
.track i.today{opacity:1;background:var(--porcelain)}
.track b{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--amber)}
.pct{text-align:right;font-weight:700;font-size:17px}
.reset{color:var(--mute);font-size:13px;text-align:right}
.bad{color:var(--claude)}
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.board div{background:var(--deep);padding:14px 16px}
.board small{color:var(--mute);display:block;font-size:12px}
.board b{font-size:22px}
.leg{display:flex;flex-wrap:wrap;gap:18px;color:var(--mute);font-size:13px}
.leg span:before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:-1px;background:var(--k)}
@media(max-width:760px){.station{grid-template-columns:20px 1fr}.station .lims{grid-column:2}.lim{grid-template-columns:60px 1fr 52px}.lim .reset{display:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="../shared/data.js"></script>
<script src="common.js"></script>
<script>
const D = window.DASH, $ = (h) => { const t = document.createElement('template'); t.innerHTML = h.trim(); return t.content.firstElementChild; };
const best = D.best(), colors = { claude: 'var(--claude)', codex: 'var(--codex)' };
const rowFor = (a, k) => D.limitRows.find((r) => r.a === a && r.k === k);
const lim = (r) => {
  if (!r) return '';
  const left = 100 - r.used, blocks = r.marks.map((m, i) => (i ? m - r.marks[i - 1] : m));
  return `<div class="lim"><span class="l">${r.label}</span><div class="track" role="img" aria-label="${r.label} ${left}% left">${blocks.map((w, i) => `<i class="${i === blocks.length - 1 ? 'today' : ''}" style="width:${w}%"></i>`).join('')}<b style="left:${r.elapsed * 100}%" title="Even pace"></b></div><span class="pct num ${left < 20 ? 'bad' : ''}">${left}%</span><span class="reset num">${r.reset ? 'resets ' + r.reset : ''}</span></div>`;
};
document.getElementById('app').append(
  $(`<header><h1>Usage lines</h1><span class="chip"><i></i>Most room: ${best.name} · ${D.left(best)}% left</span></header>`),
  $(`<div class="board">${D.nextResets.slice(0, 4).map((r) => `<div><small>${r.a.name} · ${r.label}</small><b class="num">${D.clock(r.mins)}</b> <span style="color:var(--mute)">in ${r.reset}</span></div>`).join('')}</div>`),
  ...D.byProvider.map((g) => $(`<section class="line" style="--c:${colors[g.p]}"><h2><b></b>${g.name}</h2><p class="sub">Each account is a station. Light block = used since the last day checkpoint. Amber tick = even pace.</p>${
    g.accounts.map((a) => `<div class="station"><div class="rail"><span class="dot"></span></div><div class="name"><b>${a.name}</b><span>${a.plan}</span></div><div class="lims">${lim(rowFor(a, 'five'))}${lim(rowFor(a, 'week'))}</div></div>`).join('')}</section>`)),
  $(`<div class="leg"><span style="--k:var(--porcelain)">Used since last checkpoint</span><span style="--k:var(--codex);opacity:.6">Earlier days</span><span style="--k:var(--amber);width:auto">Even pace tick</span></div>`),
);
</script>
</body>
</html>
