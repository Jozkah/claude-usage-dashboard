<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Aura: minimalist direction</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090b;--card:#111114;--fg:#f4f4f5;--mute:#8b8b95;--line:#222228;--glow:#7c5cff;--on:#fff}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--fg);font:14px/1.5 Geist,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(900px 420px at 50% -120px,#2a1f5c 0%,transparent 70%),radial-gradient(600px 300px at 85% 0,#0f3a5c55 0%,transparent 70%)}
.mono{font-family:"Geist Mono",monospace;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--mute)}
.wrap{max-width:1040px;margin:0 auto;padding:22px 24px 100px}
nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:70px}
nav .pill{display:flex;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px;background:#0c0c0fcc;backdrop-filter:blur(8px)}
nav .pill span{padding:6px 14px;border-radius:999px;color:var(--mute)}nav .pill span.on{background:var(--fg);color:var(--bg)}
h1{font-size:54px;font-weight:500;letter-spacing:-.04em;line-height:1.05;text-align:center}
h1 em{font-style:normal;background:linear-gradient(90deg,#fff,#b9a7ff);-webkit-background-clip:text;color:transparent}
.sub{text-align:center;color:var(--mute);margin:14px 0 46px;font-size:15px}
.times{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:36px}
.times div{background:var(--card);padding:16px 18px}.times b{display:block;font-size:24px;font-weight:500;letter-spacing:-.02em;margin-top:4px}
.sec{margin:34px 0 12px;display:flex;justify-content:space-between}
.card{border:1px solid var(--line);border-radius:18px;background:var(--card);overflow:hidden}
.row{display:grid;grid-template-columns:170px 1fr 1fr;gap:30px;padding:18px 22px;align-items:center}
.row+.row{border-top:1px solid var(--line)}
.row h3{font-weight:500;font-size:14.5px}
.lim .t{display:flex;justify-content:space-between;margin-bottom:9px}.lim .t b{font-family:"Geist Mono",monospace;font-weight:500;color:var(--fg);font-size:13px}.lim .t b.bad{color:#ff6b5c}
.bar{position:relative;height:6px;border-radius:3px;background:#1d1d23;display:flex}
.bar i{display:block;height:100%;background:#4a4a56;border-right:2px solid var(--card)}.bar i:first-child{border-radius:3px 0 0 3px}
.bar i.today{background:linear-gradient(90deg,#a48bff,#7c5cff);border-right:0;border-radius:0 3px 3px 0;box-shadow:0 0 14px #7c5cff88}
.bar b{position:absolute;top:-4px;bottom:-4px;width:1.5px;background:var(--on);opacity:.8}
.bar.none{background:none;height:auto}
@media(max-width:820px){.times{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}h1{font-size:36px}}
</style></head><body><div class="wrap">
<nav><span class="mono" style="color:var(--fg)">◐ Usage</span><div class="pill"><span class="on">Limits</span><span>Accounts</span><span>Resets</span><span>Daily</span></div><span class="mono">sample data</span></nav>
<div id="app"></div></div>
<script src="../shared/data.js"></script><script src="common.js"></script><script src="parts.js"></script>
<script>
const D = window.DASH, best = D.best();
const lim = (a, k) => { const l = D.limit(a, k); return `<div class="lim"><div class="t mono"><span>${k === 'five' ? 'Session' : 'Weekly'}</span>${l.left == null ? '' : `<b class="${l.left < 20 ? 'bad' : ''}">${l.left}%</b>`}</div>${l.bar}</div>`; };
document.getElementById('app').append(
  D.html(`<div><h1>Most room: <em>${best.name}</em></h1><p class="sub">${D.left(best)}% left on its tightest limit</p></div>`),
  D.html(`<div class="times">${D.nextResets.slice(0, 4).map((r) => `<div><span class="mono">${r.a.name} · ${r.label}</span><b>${D.clock(r.mins)}</b><span class="mono">in ${r.reset}</span></div>`).join('')}</div>`),
  ...D.byProvider.map((g) => D.html(`<section><div class="sec mono"><span>${g.name}</span><span>glow = used since last checkpoint · tick = even pace</span></div><div class="card">${g.accounts.map((a) => `<div class="row"><div><h3>${a.name}</h3><span class="mono">${a.plan}</span></div>${lim(a, 'five')}${lim(a, 'week')}</div>`).join('')}</div></section>`)),
);
</script></body></html>
