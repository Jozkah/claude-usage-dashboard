<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rail: minimalist direction</title><link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#0a0a0a;--mute:#737373;--line:#ececec;--soft:#f6f6f6;--ink:#0a0a0a;--hot:#ff3b1d}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--fg);font:14px/1.5 Inter,sans-serif;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{padding:20px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{width:36px;height:36px;border-radius:50%;background:var(--ink);margin:0 8px 18px}
aside a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--fg);text-decoration:none}
aside a.on{background:var(--ink);color:#fff}
aside a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
aside a sup{margin-left:auto;color:var(--mute);font-size:11px}
aside a.on sup{color:#bbb}
main{padding:56px 48px 100px;max-width:980px;width:100%}
h1{font:400 56px/1.05 "Instrument Serif",serif;letter-spacing:-.02em}
h1 i{color:var(--hot)}
.sub{color:var(--mute);margin:10px 0 30px;font-size:15px}
.tabs{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px;margin-bottom:22px}
.tabs span{padding:6px 14px;border-radius:999px;color:var(--mute)}.tabs span.on{background:#fff;color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:22px}
.row{display:grid;grid-template-columns:190px 1fr 1fr;gap:28px;padding:18px 22px;align-items:center}
.row+.row{border-top:1px solid var(--line)}
.row h3{font-size:14px;font-weight:600}.row small{color:var(--mute);display:block}
.lim{display:grid;gap:8px}
.lim .t{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px}.lim .t b{color:var(--fg);font-weight:600;font-size:14px}.lim .t b.bad{color:var(--hot)}
.bar{position:relative;height:8px;border-radius:4px;background:var(--soft);display:flex}
.bar i{display:block;height:100%;background:#c9c9c9;border-right:2px solid #fff}
.bar i:first-child{border-radius:4px 0 0 4px}.bar i.today{background:var(--ink);border-right:0;border-radius:0 4px 4px 0}
.bar b{position:absolute;top:-4px;bottom:-4px;width:2px;border-radius:1px;background:var(--hot)}
.bar.none{background:none;color:var(--mute);height:auto}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 12px}.hd h2{font:400 26px "Instrument Serif",serif}.hd span{color:var(--mute);font-size:12.5px}
.resets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:34px}
.resets div{border:1px solid var(--line);border-radius:14px;padding:14px 16px}.resets small{color:var(--mute);display:block}.resets b{font-size:22px;font-weight:500;letter-spacing:-.02em}
@media(max-width:820px){.shell{grid-template-columns:1fr}aside{display:none}.row{grid-template-columns:1fr}main{padding:32px 20px}}
</style></head><body>
<div class="shell"><aside>
<div class="logo"></div>
<a class="on"><svg viewBox="0 0 24 24"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>Limits<sup>6</sup></a>
<a><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>Accounts<sup>5</sup></a>
<a><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Resets</a>
<a><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Daily usage</a>
</aside>
<main id="app"></main></div>
<script src="../shared/data.js"></script><script src="common.js"></script><script src="parts.js"></script>
<script>
const D = window.DASH, best = D.best();
const lim = (a, k) => { const l = D.limit(a, k); return `<div class="lim"><div class="t"><span>${k === 'five' ? 'Session' : 'Weekly'}</span>${l.left == null ? '' : `<span><b class="${l.left < 20 ? 'bad' : ''}">${l.left}%</b> left</span>`}</div>${l.bar}</div>`; };
document.getElementById('app').append(
  D.html(`<div><h1>Most room: <i>${best.name}</i></h1><p class="sub">${D.left(best)}% left on its tightest limit. Next reset in ${D.nextResets[0].reset}.</p></div>`),
  D.html(`<div class="tabs"><span class="on">All</span><span>Claude Code</span><span>Codex</span></div>`),
  D.html(`<div class="resets">${D.nextResets.slice(0, 4).map((r) => `<div><small>${r.a.name} · ${r.label}</small><b>${D.clock(r.mins)}</b> <small style="display:inline">in ${r.reset}</small></div>`).join('')}</div>`),
  ...D.byProvider.map((g) => D.html(`<section><div class="hd"><h2>${g.name}</h2><span>dark block = used since the last day checkpoint · red tick = even pace</span></div><div class="card">${g.accounts.map((a) => `<div class="row"><div><h3>${a.name}</h3><small>${a.plan}</small></div>${lim(a, 'five')}${lim(a, 'week')}</div>`).join('')}</div></section>`)),
);
</script></body></html>
