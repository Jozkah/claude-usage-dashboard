name: CI
on:
  push:
    branches: [main]
    paths: &paths
      - 'server/**'
      - 'src/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'tsconfig.server.json'
      - 'eslint.config.js'
      - 'vite.config.ts'
      - '.nvmrc'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *paths
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run typecheck:server
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
